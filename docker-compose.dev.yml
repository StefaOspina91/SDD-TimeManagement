version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: time_management_dev
      POSTGRES_USER: tm_dev
      POSTGRES_PASSWORD: tm_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
