<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Time Management</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Time Management</h1>
        <p>Inicia sesión para administrar ausencias.</p>
      </header>

      <main class="card" style="max-width:480px;margin:24px auto;">
        <h2>Login</h2>
        <form id="login-form-el">
          <label>Correo (usuario)
            <input name="email" type="email" required />
          </label>
          <label>Contraseña
            <input name="password" type="password" required />
          </label>
          <label><input name="remember" type="checkbox"/> Recordarme</label>
          <div style="display:flex;gap:12px;margin-top:12px;">
            <button type="submit">Iniciar sesión</button>
            <a href="register.html" class="secondary" style="display:inline-flex;align-items:center;padding:8px 12px;text-decoration:none;">Crear cuenta</a>
          </div>
        </form>
        <p id="status" aria-live="polite"></p>
      </main>
    </div>
    <script src="./auth.js"></script>
  </body>
</html>
